<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius Previewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="card">
            <div id="left">
                <div id="shape"></div>
                <div id="text-field">
                    <input type="text">
                </div>
                <button id="copy" onclick="copyFunction()">Copy</button>
            </div>
            <div id="slider">
                <div id="slider">
                    <h3>Top-left horizontal radius</h3>
                    <input type="range" min="1" max="100" value="50" id="htlSlider">
                    <h3>Top-right horizontal radius</h3>
                    <input type="range" min="1" max="100" value="50" id="htrSlider">
                    <h3>Bottom-right horizontal radius</h3>
                    <input type="range" min="1" max="100" value="50" id="hbrSlider">
                    <h3>Bottom-left horizontal radius</h3>
                    <input type="range" min="1" max="100" value="50" id="hblSlider">
                    <h3>Top-left vertical radius</h3>
                    <input type="range" min="1" max="100" value="50" id="vtlSlider">
                    <h3>Top-right vertical radius</h3>
                    <input type="range" min="1" max="100" value="50" id="vtrSlider">
                    <h3>Bottom-right vertical radius</h3>
                    <input type="range" min="1" max="100" value="50" id="vbrSlider">
                    <h3>Bottom-left vertical radius</h3>
                    <input type="range" min="1" max="100" value="50" id="vblSlider">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
