<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius Previewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="card">
            <div id="shape"></div>
            <div id="slider">
                <h3>Top-left horizontal radius</h3>
                <input type="range">
                <h3>Top-right horizontal radius</h3>
                <input type="range">
                <h3>Bottom-right horizontal radius</h3>
                <input type="range">
                <h3>Bottom-left horizontal radius</h3>
                <input type="range">
                <h3>Top-left vertical radius</h3>
                <input type="range">
                <h3>Top-right vertical radius</h3>
                <input type="range">
                <h3>Bottom-right vertical radius</h3>
                <input type="range">
                <h3>Bottom-left vertical radius</h3>
                <input type="range">
            </div>
            <div id="text-field">
                border-radius: <input type="text">
                <button>Copy</button>
            </div>
        </div>
    </div>
</body>

</html>
